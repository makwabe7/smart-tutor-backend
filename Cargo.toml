[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
actix-cors = "0.7.1"
bcrypt = "0.19.3"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.25.0", features = ["v4", "serde"] }
jsonwebtoken = {version="11.0.0",features = ["rust_crypto",]}
futures-util = "0.3.34"
actix = "0.13"
actix-web-actors = "4.3"
